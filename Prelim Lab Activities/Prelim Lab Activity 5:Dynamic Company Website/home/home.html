<div class="home-container">

  <div class="header-column">

    <span class="avatar"
          style="background-image: url('https://hau.instructure.com/images/thumbnails/6891147/vTxT2Z08ruoaXqYg1x7weKWc43gLwxq2bFPa2Nlx');">
      <span class="screenreader-only">LUIS GABRIEL AQUINO</span>
      <i class="icon-edit"></i>
    </span>


    <div class="header-card">
      <div class="header-text">
        <h1>{{ message }}</h1>
        <h2>{{ title }}</h2>
        <h3>{{ description }}</h3>
      </div>
    </div>
  </div>
</div>

<style>
  .home-container {
    height: 100vh;
    width: 100%;
    background-image: url('https://wallpapers.com/images/featured/rick-and-morty-pictures-b3e2pq02sb2fuvy3.webp');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 60px;
  }

  .header-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }


  .avatar {
    width: 220px;
    height: 220px;
    display: inline-block;
    background-size: cover;
    background-position: center;
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(255, 255, 255, 0.5);
    margin-bottom: 25px;
    border: 6px solid #ec7505;
  }


  .header-card {
    background-color: #ffffff;
    border: 3px solid #ec7505;
    border-radius: 12px;
    padding: 20px 30px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    max-width: 500px;
    opacity: 1;
  }

  .header-text h1,
  .header-text h2,
  .header-text h3 {
    color: #ec7505;
    margin: 8px 0;
    font-family: 'Arial Black', 'Impact', sans-serif;
    font-weight: bold;
    text-shadow: none;
  }

  .screenreader-only {
    position: absolute;
    left: -9999px;
  }
</style>
