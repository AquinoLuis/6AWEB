<div class="home-container">
  <!-- Profile + Text Row -->
  <div class="header-row">
    <!-- Profile Picture -->
    <span class="avatar"
          style="background-image: url('https://hau.instructure.com/images/thumbnails/6891147/vTxT2Z08ruoaXqYg1x7weKWc43gLwxq2bFPa2Nlx');">
      <span class="screenreader-only">LUIS GABRIEL AQUINO</span>
      <i class="icon-edit"></i>
    </span>

    <!-- Text beside the image -->
    <div class="header-text">
      <h1>{{ message }}</h1>
      <h2>{{ title }}</h2>
      <h3>{{ description }}</h3>
    </div>
  </div>
</div>

<style>
  .home-container {
    height: 100vh;
    width: 100%;
    background-image: url('https://wallpapers.com/images/featured/rick-and-morty-pictures-b3e2pq02sb2fuvy3.webp');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    padding: 20px;
  }

  /* Row layout: image left, text right */
  .header-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }

  /* Avatar styling with orange border */
  .avatar {
    width: 180px;   /* bigger size */
    height: 180px;
    display: inline-block;
    background-size: cover;
    background-position: center;
    border-radius: 50%;
    box-shadow: 0 2px 6px rgba(255, 255, 255, 0.4);
    margin-right: 20px;

    /* Orange border */
    border: 5px solid #ec7505;
  }

  /* Text beside image */
  .header-text h1,
  .header-text h2,
  .header-text h3 {
    color: rgb(247, 99, 40); /* text is black */
    margin: 5px 0;
    text-shadow: none;
  }

  .screenreader-only {
    position: absolute;
    left: -9999px;
  }
</style>
